name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # La app es multiplataforma y TTS/audio tienen ramas por SO: correr solo
    # en Linux se deixaba pasar justo los bugs de encoding (cp1252) y de
    # emojis en consola, que son justo los que rompian en Windows.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          # 3.12 en Linux es lo mas pesado; el resto se cubre igual en CI.
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install Pillow ttkbootstrap

    - name: Verify signature
      run: python verificar_firma.py

    - name: Syntax check
      run: |
        python -m py_compile main.py
        python -m py_compile ai_module.py
        python -m py_compile tts_module.py
        python -m py_compile audio.py
        python -m py_compile sounds.py
        python -m py_compile face_animation.py
        python -m py_compile ascii_art.py
        python -m py_compile progress_tracker.py
        python -m py_compile check_deps.py
        python -m py_compile install.py
        python -m py_compile knowledge.py
        python -m py_compile config_store.py
        python -m py_compile download_worker.py
        python -m py_compile logging_setup.py

    - name: Run tests (xvfb)
      if: runner.os == 'Linux'
      run: xvfb-run python test_all.py

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: python test_all.py

    - name: Shell syntax check
      if: runner.os == 'Linux'
      run: |
        bash -n luna.sh
        bash -n install.sh
        bash -n uninstall.sh

    - name: PowerShell syntax check (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $errors = $null
        [System.Management.Automation.Language.Parser]::ParseFile(
          (Resolve-Path install_windows.ps1), [ref]$null, [ref]$errors) | Out-Null
        if ($errors -and $errors.Count -gt 0) {
          $errors | ForEach-Object { Write-Error $_.Message }
          exit 1
        }
        Write-Output "install_windows.ps1 OK"